[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climbhill-ai"
version = "0.1.0"
description = "Local-first tooling for controlled recursive repository improvement with coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "ClimbHill.ai Contributors"}
]
keywords = [
    "ai",
    "self-improvement",
    "coding-agents",
    "mcp",
    "codex",
    "repository",
    "agents",
    "llm",
    "evaluation",
    "policy",
    "sqlite",
    "automation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.5.0",
    "python-dateutil>=2.8.0",
    "typing-extensions>=4.8.0",
    "python-dotenv>=1.2.1",
    "PyYAML>=6.0",
    "mcp[cli]>=1.27,<2",
    "tox>=4.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
    "pre-commit>=3.5.0",
    "tomli>=2.0.0; python_version < '3.11'",
]
mcp = [
    "mcp>=1.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autodoc-typehints>=1.24.0",
]
all = [
    "openai>=1.0.0",
    "google-generativeai>=0.3.0",
    "anthropic>=0.7.0",
]

[project.urls]
Homepage = "https://climbhill.ai"
Documentation = "https://climbhill.ai"
Repository = "https://github.com/closedloop-technologies/climbhill"
Issues = "https://github.com/closedloop-technologies/climbhill/issues"

[project.scripts]
climbhill = "climbhill.cli:main"
climbhill-audit = "climbhill.audit:main"
climbhill-op-check = "climbhill.op_env:main"
climbhill-live-smoke = "benchmark.live_smoke:main"
climbhill-source-check = "climbhill.source_refresh:main"
climbhill-mcp = "climbhill.mcp_server:main"
climbhill-mcp-smoke = "climbhill.mcp_server:smoke_main"

[tool.setuptools]
packages = ["climbhill", "benchmark"]

[tool.setuptools.package-data]
climbhill = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.tox
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib"
]

testpaths = [
    "tests"            # Main project tests. Skill tests run through tox or explicit paths.
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["climbhill"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
