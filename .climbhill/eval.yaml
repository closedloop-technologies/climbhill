version: 1

commands:
  - id: cli-tests
    kind: test
    command: "pytest tests/test_cli.py"
    required: true
  - id: diff-check
    kind: static
    command: "git diff --check"
    required: true
  - id: plugin-validation
    kind: static
    command: "python3 /home/gibson/.codex/skills/.system/plugin-creator/scripts/validate_plugin.py plugin/climbhill-ai"
