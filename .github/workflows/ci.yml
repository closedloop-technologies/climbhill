name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Node and BAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check generated BAML clients
        run: npm run baml:check

      - name: Verify vendored OKF specification
        run: npm run okf:spec

      - name: Test npm CLI
        run: npm test

      - name: Run bounded Ouroboros dogfood
        run: npm run dogfood

      - name: Check npm package
        run: npm pack --dry-run

      - name: Install website dependencies
        run: npm ci --prefix www

      - name: Build website
        run: npm run www:build

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test tools
        run: python -m pip install --upgrade ".[dev]" build twine

      - name: Run tests
        run: pytest

      - name: Build package
        run: python -m build

      - name: Check package
        run: python -m twine check dist/*

      - name: Validate root Codex plugin
        run: python .github/scripts/validate_plugin.py .

      - name: Validate packaged Codex plugin
        run: python .github/scripts/validate_plugin.py plugin/climbhill-ai

      - name: Smoke CLI
        run: |
          climbhill --help
          climbhill-mcp-smoke

      - name: Smoke generated Python BAML client
        run: python -c "from climbhill.baml_client import types; assert types.DerivationResult"
